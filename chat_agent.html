<!DOCTYPE html>
<html>
<head>
    <title>Medicare AI Agent</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: white; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #007bff; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-box { height: 350px; padding: 15px; overflow-y: auto; background: #f9f9f9; }
        .msg { padding: 10px; margin: 5px 0; border-radius: 10px; max-width: 80%; font-size: 14px; }
        .bot { background: #e9ecef; color: #333; float: left; clear: both; }
        .user { background: #007bff; color: white; float: right; clear: both; }
        .input-area { padding: 15px; border-top: 1px solid #ddd; display: flex; background: white; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { margin-left: 10px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 20px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">🤖 Medicare Agent</div>
    <div id="chat-box">
        <div class="msg bot">Hello! I am the Medicare AI. How can I help you today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="Type symptoms..." onkeypress="handleEnter(event)">
        <button onclick="sendMsg()">Send</button>
    </div>
</div>

<script>
    var socket = io();
    var chatBox = document.getElementById('chat-box');

    socket.on('response', function(data) {
        addMessage(data.msg, 'bot');
    });

    function sendMsg() {
        var input = document.getElementById('msg');
        var text = input.value.trim();
        if(text) {
            addMessage(text, 'user');
            socket.emit('message', {data: text});
            input.value = '';
        }
    }

    function addMessage(text, sender) {
        var div = document.createElement('div');
        div.className = 'msg ' + sender;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleEnter(e) {
        if(e.key === 'Enter') sendMsg();
    }
</script>

</body>
</html>
