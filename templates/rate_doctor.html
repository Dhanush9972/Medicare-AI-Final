{% extends "base.html" %}
{% block title %}Rate Doctor - MediCare{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #f59e0b;">⭐ Rate Dr. {{ doctor.full_name }}</h2>
    <p style="text-align: center; color: #666;">Your feedback helps improve our community.</p>

    <form method="POST" style="margin-top: 30px;">
        <div style="margin-bottom: 20px; text-align: center;">
            <label style="display: block; margin-bottom: 10px; font-weight: bold;">Select Rating</label>
            <div class="rating-stars" style="font-size: 2.5em; color: #ddd; cursor: pointer;">
                <span onclick="setRating(1)" id="s1">★</span>
                <span onclick="setRating(2)" id="s2">★</span>
                <span onclick="setRating(3)" id="s3">★</span>
                <span onclick="setRating(4)" id="s4">★</span>
                <span onclick="setRating(5)" id="s5">★</span>
            </div>
            <input type="hidden" name="rating" id="ratingInput" required>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Comment (Optional)</label>
            <textarea name="comment" rows="4" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;" placeholder="Share your experience..."></textarea>
        </div>

        <button type="submit" style="width: 100%; background: #f59e0b; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1.1em;">Submit Rating</button>
    </form>
</div>

<script>
    function setRating(n) {
        document.getElementById('ratingInput').value = n;
        for(let i=1; i<=5; i++) {
            document.getElementById('s'+i).style.color = (i <= n) ? '#f59e0b' : '#ddd';
        }
    }
</script>
{% endblock %}
